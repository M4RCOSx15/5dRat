# Catalogo unico de versoes. Versoes exatas, sem "+" nem "latest".
# Ultima verificacao das versoes: 2026-10-29
# Fontes: developer.android.com (AGP/Gradle), kotlinlang.org (Kotlin),
# plugins.gradle.org (ktlint-gradle).
[versions]
agp = "9.4.1"
# Kotlin: gerenciado pelo built-in Kotlin do AGP 9 (KGP >= 2.2.10 automatico).
ktlintGradle = "14.2.0"
junit = "4.13.2"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
# Ultima verificacao: 2026-10-29 em dl.google.com/dl/android/maven2
composeBom = "2026.06.01"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
sqliteJdbc = "3.54.1.0"
androidxTestJunit = "1.3.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
# Compose Compiler plugin — versao casada com o Kotlin embutido no AGP (ADR-005)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version = "2.4.21" }
